name: Build FreakyKernel dreamlte

on:
  workflow_dispatch:
  push:
    branches:
      - oc-exynos8895

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: exynos8895-dreamlte_defconfig
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_ARM32: arm-linux-gnueabi-
      CROSS_COMPILE_COMPAT: arm-linux-gnueabi-

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            flex \
            build-essential \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            cpio \
            xz-utils \
            unzip \
            zip \
            curl \
            git \
            python3 \
            file

      - name: Show compiler versions
        run: |
          echo "===== AARCH64 ====="
          aarch64-linux-gnu-gcc --version

          echo
          echo "===== ARM32 ====="
          arm-linux-gnueabi-gcc --version

          echo
          echo "===== HOST ====="
          gcc --version

      - name: Prepare output
        run: |
          rm -rf out artifacts
          mkdir -p out artifacts

      - name: Configure dreamlte
        run: |
          make \
            O=out \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            "$DEFCONFIG"

      - name: Match working kernel release
        run: |
          ./scripts/config --file out/.config --set-str LOCALVERSION ""
          ./scripts/config --file out/.config --disable LOCALVERSION_AUTO

          make \
            O=out \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            olddefconfig

          echo "===== LOCALVERSION ====="
          grep -E '^CONFIG_LOCALVERSION=|^# CONFIG_LOCALVERSION_AUTO' out/.config

          echo
          echo "===== KERNEL RELEASE ====="
          make -s \
            O=out \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            kernelrelease

          echo
          echo "===== DTBTOOL ====="
          grep '^CONFIG_EXYNOS_DTBTOOL=' out/.config

      - name: Build kernel
        shell: bash
        run: |
          set -o pipefail

          make \
            O=out \
            -j"$(nproc)" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            Image Image.gz dtb.img \
            2>&1 | tee build.log

      - name: Verify build outputs
        run: |
          test -s out/arch/arm64/boot/Image
          test -s out/arch/arm64/boot/Image.gz
          test -s out/arch/arm64/boot/dtb.img

          echo "===== BUILD OUTPUTS ====="
          ls -lh out/arch/arm64/boot/Image \
                 out/arch/arm64/boot/Image.gz \
                 out/arch/arm64/boot/dtb.img

          echo
          file out/arch/arm64/boot/Image
          file out/arch/arm64/boot/Image.gz
          file out/arch/arm64/boot/dtb.img || true

          echo
          echo "===== EMBEDDED LINUX VERSION ====="
          strings out/arch/arm64/boot/Image \
            | grep -m1 '^Linux version ' || true

      - name: Collect kernel artifacts
        run: |
          cp out/arch/arm64/boot/Image artifacts/Image
          cp out/arch/arm64/boot/Image.gz artifacts/Image.gz
          cp out/arch/arm64/boot/dtb.img artifacts/dtb.img
          cp out/.config artifacts/kernel.config
          cp build.log artifacts/build.log

      - name: Download MagiskBoot
        run: |
          curl -L \
            --fail \
            --retry 3 \
            -o /tmp/Magisk-v30.7.apk \
            https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk

          unzip -p \
            /tmp/Magisk-v30.7.apk \
            'lib/x86_64/libmagiskboot.so' \
            > /tmp/magiskboot

          chmod +x /tmp/magiskboot

      - name: Build boot.img preserving original DTB
        shell: bash
        run: |
          set -e

          BASE="$GITHUB_WORKSPACE/boot/boot-base.img"

          test -s "$BASE" || {
            echo "::error::boot/boot-base.img nao encontrado"
            exit 1
          }

          rm -rf "$GITHUB_WORKSPACE/repack"
          mkdir -p "$GITHUB_WORKSPACE/repack"

          cp "$BASE" "$GITHUB_WORKSPACE/repack/boot-base.img"

          cd "$GITHUB_WORKSPACE/repack"

          echo "========================================"
          echo " UNPACK ORIGINAL BOOT"
          echo "========================================"

          /tmp/magiskboot unpack boot-base.img \
            2>&1 | tee /tmp/original-boot-info.txt

          test -s kernel
          test -s ramdisk.cpio
          test -s extra

          echo
          echo "===== ORIGINAL COMPONENTS ====="
          ls -lh kernel ramdisk.cpio extra

          echo
          echo "===== ORIGINAL HASHES ====="
          sha256sum kernel ramdisk.cpio extra

          cp ramdisk.cpio /tmp/original-ramdisk.cpio
          cp extra /tmp/original-extra

          sha256sum /tmp/original-ramdisk.cpio \
            > /tmp/original-ramdisk.sha256

          sha256sum /tmp/original-extra \
            > /tmp/original-extra.sha256

          echo
          echo "========================================"
          echo " REPLACE ONLY KERNEL"
          echo "========================================"

          cp "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image" kernel

          echo
          echo "New kernel:"
          sha256sum kernel
          ls -lh kernel

          echo
          echo "Original DTB/extra remains:"
          sha256sum extra

          echo
          echo "Original ramdisk remains:"
          sha256sum ramdisk.cpio

          echo
          echo "========================================"
          echo " REPACK"
          echo "========================================"

          /tmp/magiskboot repack \
            boot-base.img \
            "$GITHUB_WORKSPACE/artifacts/boot.img"

          test -s "$GITHUB_WORKSPACE/artifacts/boot.img"

      - name: Verify final boot image
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/repack-verify"
          mkdir -p "$GITHUB_WORKSPACE/repack-verify"

          cp "$GITHUB_WORKSPACE/artifacts/boot.img" \
             "$GITHUB_WORKSPACE/repack-verify/boot.img"

          cd "$GITHUB_WORKSPACE/repack-verify"

          echo "========================================"
          echo " UNPACK FINAL BOOT"
          echo "========================================"

          /tmp/magiskboot unpack boot.img \
            2>&1 | tee /tmp/final-boot-info.txt

          test -s kernel
          test -s ramdisk.cpio
          test -s extra

          echo
          echo "===== FINAL COMPONENTS ====="
          ls -lh kernel ramdisk.cpio extra

          echo
          echo "===== FINAL HASHES ====="
          sha256sum kernel ramdisk.cpio extra

          echo
          echo "========================================"
          echo " VERIFY NEW KERNEL"
          echo "========================================"

          cmp -s \
            kernel \
            "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image" || {
              echo "::error::Kernel final difere do Image compilado"
              exit 1
          }

          echo "Kernel novo: OK"

          echo
          echo "========================================"
          echo " VERIFY ORIGINAL RAMDISK"
          echo "========================================"

          cmp -s \
            ramdisk.cpio \
            /tmp/original-ramdisk.cpio || {
              echo "::error::Ramdisk foi alterado"
              exit 1
          }

          echo "Ramdisk original: OK"

          echo
          echo "========================================"
          echo " VERIFY ORIGINAL DTB / EXTRA"
          echo "========================================"

          cmp -s \
            extra \
            /tmp/original-extra || {
              echo "::error::DTB/extra original foi alterado"
              exit 1
          }

          echo "DTB/extra original: OK"

          echo
          echo "========================================"
          echo " VERIFY HEADER"
          echo "========================================"

          grep -q 'HEADER_VER.*\[0\]' /tmp/final-boot-info.txt
          grep -q 'PAGESIZE.*\[2048\]' /tmp/final-boot-info.txt
          grep -q 'SAMSUNG_SEANDROID' /tmp/final-boot-info.txt

          echo "Header v0: OK"
          echo "Page size 2048: OK"
          echo "Samsung SEAndroid trailer: OK"

          echo
          echo "========================================"
          echo " BOOT VALIDATION PASSED"
          echo "========================================"
          echo "Only the kernel payload changed."
          echo "Ramdisk and DTB/extra are byte-identical to boot-base.img."

      - name: Final artifact information
        run: |
          echo "===== ARTIFACTS ====="
          ls -lah artifacts/

          echo
          echo "===== SHA256 ====="
          sha256sum artifacts/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FreakyKernel-dreamlte-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
